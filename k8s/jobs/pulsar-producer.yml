apiVersion: batch/v1
kind: Job
metadata:
  name: map-matcher
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600  # Job will be deleted 1 hour after completion
  template:
    metadata:
      labels:
        app: map-matcher
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-pulsar
          image: curlimages/curl:7.85.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://pulsar-broker:8080/admin/v2/brokers/health; do
                echo "Waiting for Pulsar broker..."
                sleep 5
              done
      containers:
        - name: map-matcher
          image: flow-map-matcher-alex-flow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6650
          # resources:
          #   requests:
          #     cpu: "500m"
          #     memory: "2Gi" # or 1Gi if needed
          #   limits:
          #     cpu: "500m"
          #     memory: "2Gi" # or 1.5Gi
