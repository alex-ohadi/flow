services:
  pulsar-alex-postgres:
    image: pulsar-alex-postgres:latest  
    container_name: pulsar-alex-postgres
    build:
      context: .
      dockerfile: postgres/Dockerfile
    platform: linux/arm64/v8  # Ensure ARM64 architecture for M1/M2 Macs
    restart: always
    env_file: ./.env
    ports:
      - "5432:5432"
    networks:
      - default
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      
  pulsar-alex-producer:
    image: pulsar-alex-producer:latest  
    container_name: pulsar-alex-producer
    depends_on:
      - pulsar-alex-postgres
    build:
      context: .
      dockerfile: a_producer/Dockerfile
    env_file: ./.env
    restart: always
    networks:
      - default


  pulsar-alex-consumer:
    image: pulsar-alex-consumer:latest  
    container_name: pulsar-alex-consumer
    depends_on:
      - pulsar-alex-postgres
    build:
      context: .
      dockerfile: a_consumer/Dockerfile
    env_file: ./.env
    restart: always
    networks:
      - default

  # pulsar:
  #   image: apachepulsar/pulsar:2.10.1
  #   container_name: pulsar-broker
  #   command: >
  #     bash -c "bin/pulsar standalone"
  #   ports:
  #     - "6650:6650"
  #     - "8080:8080" 

volumes:
  mongo_data_for_flow:
    name: mongo_data_for_flow
    external: true

networks:
  default:
    driver: bridge
